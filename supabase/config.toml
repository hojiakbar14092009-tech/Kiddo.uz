# Supabase CLI settings. Only what this repo needs: the Edge Functions of
# Phases 7 and 10 (docs/architecture/audio-security.md, ai-tutor.md). Everything else keeps the
# CLI defaults. `project_id` is the CLI's local name for the stack (required
# by the config loader), not the remote project ref (`supabase link` sets that).
project_id = "kiddo-uz"

# The gateway rejects a request without a valid Supabase JWT before the
# function runs (on top of the function's own token, PRO and rate checks).
[functions.voice-url]
verify_jwt = true

[functions.tts]
verify_jwt = true

[functions.tutor]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Phase 53: called before any account exists (the app's anonymous analytics);
# the function limits each IP itself.
[functions.analytics]
verify_jwt = false

# Phase 53: started by pg_cron with its own WORKER_SECRET (not a Supabase JWT).
[functions.worker]
verify_jwt = false

# Phase 56: the parents' bot webhook. Telegram sends no Supabase JWT; the function
# checks the secret given to setWebhook (TELEGRAM_WEBHOOK_SECRET) itself.
[functions.telegram]
verify_jwt = false

# Phase 57: the owner's work bot webhook. It checks OWNER_BOT_WEBHOOK_SECRET itself and
# answers only OWNER_TELEGRAM_ID.
[functions.owner-bot]
verify_jwt = false
